<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ado - ROCKSTAR</title>
<style>
  /* 整体背景：暗黑偏红的渐变 */
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    
    /* 👇 下面是新增的背景代码 👇 */
    background-image: 
      linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.8)), /* 黑色半透明遮罩 */
      url('https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/94/63/b0/9463b0c2-92b6-f1f6-32a6-237b8d1a2df6/22UMGIM47880.rgb.jpg/1000x1000bb.jpg'); /* 专辑图链接 */
    background-size: cover;      /* 等比放大铺满屏幕 */
    background-position: center; /* 图片居中显示 */
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  /* 毛玻璃质感的卡片 */
  .card {
    width: 85%;
    max-width: 380px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    padding: 32px 24px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    text-align: center;
  }

  /* 标题样式 */
  h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: 1px; }
  .artist { color: #ff4d4d; margin: 0 0 28px; font-size: 16px; font-weight: 600; letter-spacing: 2px; }

  /* 按钮基础样式 */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 14px;
    margin: 12px 0;
    border-radius: 14px;
    text-decoration: none;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    transition: transform 0.15s, opacity 0.15s;
  }

  /* 点按反馈效果 */
  .btn:active { transform: scale(0.97); opacity: 0.8; }

  /* 图标通用样式（将图标固定在左侧并反白处理） */
  .btn img {
    position: absolute;
    left: 18px;
    width: 24px;
    height: 24px;
    filter: brightness(0) invert(1); /* 让黑色图标变白 */
  }

  /* 各平台专属颜色 */
  .youtube { background: #ff0033; }
  .spotify { background: #1db954; }
  .apple { background: #fa243c; }
  .universal { background: #333; border: 1px solid rgba(255,255,255,0.2); }

  .tip { color: #888; font-size: 12px; line-height: 1.5; margin-top: 20px; }
</style>
</head>
<body>
  <div class="card">
    <h1>ロックスター (ROCKSTAR)</h1>
    <p class="artist">Ado</p>

    <!-- 带有图片的按钮 -->
    <a class="btn youtube" href="https://youtu.be/hRJpiCZlLX8" target="_blank" rel="noopener">
      <img src="https://cdn.simpleicons.org/youtube/white" alt="YT"> YouTube 观看 MV
    </a>
    
    <a class="btn spotify" href="https://open.spotify.com/track/22wzqoECjwKEZEw37WbAXX" target="_blank" rel="noopener">
      <img src="https://cdn.simpleicons.org/spotify/white" alt="SP"> Spotify 播放
    </a>
    
    <a id="appleMusicBtn" class="btn apple" href="https://music.apple.com/jp/song/1802574373" target="_blank" rel="noopener">
      <img src="https://cdn.simpleicons.org/applemusic/white" alt="AM"> Apple Music 播放
    </a>
    
    <a class="btn universal" href="https://ado.lnk.to/best_adobumID" target="_blank" rel="noopener">
      <img src="https://cdn.simpleicons.org/linktree/white" alt="Link"> 更多平台
    </a>

    <p class="tip">如果点击后没有跳转到 App，请点击右上角“在浏览器中打开”后再试。</p>
  </div>

<script>
  // 自动识别安卓系统，并替换 Apple Music 的跳转链接
  (function () {
    var isAndroid = /Android/i.test(navigator.userAgent);
    var btn = document.getElementById('appleMusicBtn');
    if (isAndroid && btn) {
      btn.href = 'intent://music.apple.com/jp/song/1802574373#Intent;scheme=https;package=com.apple.android.music;S.browser_fallback_url=https://play.google.com/store/apps/details?id=com.apple.android.music;end';
    }
  })();
</script>
</body>
</html>
