<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ado - ROCKSTAR</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .card {
    width: 90%;
    max-width: 420px;
    background: #1c1c1e;
    border-radius: 20px;
    padding: 28px 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .artist { color: #aaa; margin: 0 0 24px; font-size: 15px; }
  .btn {
    display: block;
    text-align: center;
    padding: 14px;
    margin: 10px 0;
    border-radius: 12px;
    text-decoration: none;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
  }
  .youtube { background: #ff0033; }
  .spotify { background: #1db954; }
  .apple { background: #fa243c; }
  .universal { background: #555; }
  .tip { color: #888; font-size: 12px; line-height: 1.5; margin-top: 18px; }
</style>
</head>
<body>
  <div class="card">
    <h1>ロックスター (ROCKSTAR)</h1>
    <p class="artist">Ado</p>

    <a class="btn youtube" href="https://youtu.be/hRJpiCZlLX8" target="_blank" rel="noopener">YouTube 观看 MV</a>
    <a class="btn spotify" href="https://open.spotify.com/track/22wzqoECjwKEZEw37WbAXX" target="_blank" rel="noopener">Spotify 播放</a>
    <a id="appleMusicBtn" class="btn apple" href="https://music.apple.com/jp/song/1802574373" target="_blank" rel="noopener">Apple Music 播放</a>
    <a class="btn universal" href="https://ado.lnk.to/best_adobumID" target="_blank" rel="noopener">更多平台</a>

    <p class="tip">如果点击后没有跳转到 App，请点击右上角“在浏览器中打开”后再试。</p>
  </div>

<script>
  // Android 上把 Apple Music 链接换成 intent://，更容易唤起 App
  (function () {
    var isAndroid = /Android/i.test(navigator.userAgent);
    var btn = document.getElementById('appleMusicBtn');
    if (isAndroid && btn) {
      btn.href = 'intent://music.apple.com/jp/song/1802574373#Intent;scheme=https;package=com.apple.android.music;S.browser_fallback_url=https://play.google.com/store/apps/details?id=com.apple.android.music;end';
    }
  })();
</script>
</body>
</html>
